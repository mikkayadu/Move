# Render blueprint for Move - both the API and the PWA on one account.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance,
# point it at this repo, then fill in the values marked `sync: false`.
#
# The two services reference each other's hostnames, so there is no manual
# URL copying: the PWA learns where the API lives and the API learns which
# origin to allow. Both sides add the https:// scheme themselves, because a
# `fromService` reference yields a bare hostname.
services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: move-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_PATH
        value: /app/data/move.sqlite
      - key: CORS_ORIGINS
        fromService:
          name: move-web
          type: web
          property: host
      # Paste these in the dashboard - they are secrets.
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      # Set to whatever `npm run models` reported for your key.
      - key: GEMMA_MODEL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@move.app
    disk:
      # Without a disk the free plan wipes SQLite on every deploy, taking the
      # graceful-degradation cache and every saved destination with it.
      name: move-data
      mountPath: /app/data
      sizeGB: 1

  # ---------------------------------------------------------------- PWA ----
  - type: web
    name: move-web
    runtime: static
    buildCommand: npm install && npm run build --workspace @move/web
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_BASE_URL
        fromService:
          name: move-api
          type: web
          property: host
    routes:
      # apps/web/public/_redirects carries the same rule, so single-page
      # routing still works if this block is not applied.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # A cached service worker strands users on an old build for as long as
      # the cache lives. This is the one file that must always revalidate.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
