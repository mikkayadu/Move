# Render blueprint for the Move API.
#
# This deploys the backend only - a WEB SERVICE, because NestJS has to stay
# running to answer requests, hold SQLite, and fire the notification sweep.
# The PWA is hosted separately; see "Deploying" in README.md.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance,
# point it at this repo, then fill in every value marked `sync: false`.
#
# TWO VALUES TIE THE HALVES TOGETHER, and both must be set by hand:
#   1. CORS_ORIGINS here  -> the URL your frontend is served from
#   2. VITE_API_BASE_URL on the frontend host -> this service's URL
# Get either wrong and the browser blocks every request. If you only have the
# hostname, that is fine: the API adds the https:// scheme itself.
#
# FREE TIER CAVEATS, both real:
#   - A free web service sleeps when idle and takes the better part of a
#     minute to wake. A judge clicking a cold link sees the page load fast
#     and the first recommendation hang. Warm it before demoing, or point an
#     uptime pinger at /api/health, or run it on a paid instance.
#   - Persistent disks need a PAID instance. On free, SQLite sits on
#     ephemeral storage, so saved destinations, push subscriptions, and the
#     stale-recommendation cache are wiped on every deploy and every wake.
#     The schema is re-created on boot, so the app starts empty, not broken.
services:
  - type: web
    name: move-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_PATH
        value: /app/data/move.sqlite

      # The origin your PWA is served from, e.g. https://move.netlify.app
      # Comma-separated if you have more than one.
      - key: CORS_ORIGINS
        sync: false

      # Secrets - paste these in the dashboard, never commit them.
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false

      # Set to whatever `npm run models` reported for your key.
      - key: GEMMA_MODEL
        sync: false

      # From `npm run keys`. Without them push is disabled, nothing else.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@move.app

    # To keep data across deploys, change `plan: free` to `plan: starter`
    # above and uncomment this:
    #
    # disk:
    #   name: move-data
    #   mountPath: /app/data
    #   sizeGB: 1
