# Render blueprint for the Move API.
#
# Deploy with: connect the repo at https://dashboard.render.com/blueprints
# Then set the two secret values (marked sync: false) in the dashboard.
services:
  - type: web
    name: move-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_PATH
        value: /app/data/move.sqlite
      # Set this to the deployed web origin once the frontend has a URL.
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@move.app
    disk:
      # Without a disk the free plan wipes SQLite on every deploy, which would
      # take the graceful-degradation cache with it.
      name: move-data
      mountPath: /app/data
      sizeGB: 1
