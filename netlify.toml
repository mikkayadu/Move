# Netlify build for the Move PWA.
#
# Set VITE_API_BASE_URL in the Netlify UI to the deployed API origin
# (for example https://move-api.onrender.com) before the first build.
[build]
  base = "."
  command = "npm run build --workspace @move/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every path resolves to the shell, which the service worker
# has already cached.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from a stale cache, or users get
# stuck on an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
